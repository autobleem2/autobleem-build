# The rolling development build of a component: a GitHub pre-release tagged `nightly` on the calling
# repository, moved to this commit, its assets replaced by the given files. autobleem-appliance's nightly
# assembly (assemble.yml, channel nightly) fetches every component from these the way it fetches a v* release -
# release assets are public, so no cross-repository token is needed, which run artifacts would.
#
#   - uses: autobleem2/autobleem-build/.github/actions/nightly-release@master
#     with:
#       files: out/*.tar.gz
#       version: ${{ needs.plan.outputs.version }}
#
# The job needs `permissions: contents: write`. Call it for a push to develop (or a manual run on develop)
# only - never for a pull request, never for a v* tag (those have their own release).
#
# With `dispatch-token` (2026-09-26) it then tells the assembler: a `component-nightly` repository_dispatch to
# autobleem-appliance (client_payload {repo, sha, version}), which assembles the nightly at once rather than at
# the next schedule. The token is the autobleem-admin GitHub App's, minted in the calling job - GITHUB_TOKEN
# cannot start a workflow in another repository:
#
#   - id: app
#     if: vars.AB_ADMIN_APP_ID != ''
#     uses: actions/create-github-app-token@v2
#     with:
#       app-id: ${{ vars.AB_ADMIN_APP_ID }}
#       private-key: ${{ secrets.AB_ADMIN_APP_KEY }}
#       owner: autobleem2
#       repositories: autobleem-appliance
#   - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
#     with:
#       files: out/*.tar.gz
#       version: ${{ needs.plan.outputs.version }}
#       dispatch-token: ${{ steps.app.outputs.token }}
#
# An empty token (a repository without the App's variable yet) publishes the nightly and says the assembly is
# left to the schedule. A token that is set but refused fails the step - after the assets are up, so the
# nightly release is current either way and the red job says the chain is broken.
name: nightly-release
description: Replace the assets of the component's rolling `nightly` pre-release with this build's files
inputs:
  files:
    description: the files to attach (a shell glob, or several, space separated)
    required: true
  version:
    description: the build's version (git describe), shown in the release notes
    required: false
    default: ''
  token:
    description: a token with contents:write on the repository
    required: false
    default: ${{ github.token }}
  dispatch-token:
    description: a token allowed to send a repository_dispatch to dispatch-repo (the admin App's); empty = do not
    required: false
    default: ''
  dispatch-repo:
    description: the repository whose assembly the new nightly starts
    required: false
    default: autobleem2/autobleem-appliance
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        FILES: ${{ inputs.files }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo="$GITHUB_REPOSITORY"; tag=nightly
        shopt -s nullglob
        # shellcheck disable=SC2206 - FILES is globs on purpose
        files=($FILES)
        [ "${#files[@]}" -gt 0 ] || { echo "nightly-release: no file matches '$FILES'" >&2; exit 1; }
        # the tag follows the branch: moved when it exists, made when it does not
        if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
          gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
        else
          gh api "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
        fi
        notes="Development build of ${GITHUB_REF_NAME} - ${VERSION:-$GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC')).
        Replaced by every successful build of ${GITHUB_REF_NAME}; not a release. Run: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}"
        id="$(gh api "repos/$repo/releases/tags/$tag" --jq .id 2>/dev/null || true)"
        if ! [[ "$id" =~ ^[0-9]+$ ]]; then
          gh release create "$tag" --repo "$repo" --prerelease --title "Development build (nightly)" \
            --notes "$notes" --verify-tag >/dev/null
          id="$(gh api "repos/$repo/releases/tags/$tag" --jq .id)"
        else
          gh api -X PATCH "repos/$repo/releases/$id" -f body="$notes" -F prerelease=true >/dev/null
        fi
        # every old asset goes: the names carry the version, so --clobber alone would leave the last build's
        # files next to this one's and the assembler would find two of each
        for aid in $(gh api --paginate "repos/$repo/releases/$id/assets" --jq '.[].id'); do
          gh api -X DELETE "repos/$repo/releases/assets/$aid"
        done
        gh release upload "$tag" --repo "$repo" "${files[@]}" --clobber
        echo "nightly-release: $repo@$tag = ${VERSION:-$GITHUB_SHA}: ${files[*]##*/}"
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.dispatch-token }}
        TARGET: ${{ inputs.dispatch-repo }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$GH_TOKEN" ]; then
          echo "::notice::nightly-release: no dispatch-token - $TARGET assembles this at its next schedule"
          exit 0
        fi
        gh api -X POST "repos/$TARGET/dispatches" -f event_type=component-nightly \
          -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[sha]=$GITHUB_SHA" \
          -f "client_payload[version]=${VERSION:-$GITHUB_SHA}" >/dev/null
        echo "nightly-release: asked $TARGET to assemble the nightly"
