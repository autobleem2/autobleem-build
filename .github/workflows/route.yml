# route: picks which runner a caller's job should use, so a repo's build.yml never hard-codes
# "self-hosted" (or juggles which self-hosted box is actually up). One job, ubuntu-24.04, ~10s.
#
# Order of preference:
#   1. the laptop runner (label ab-main), when it is registered and online
#   2. the build server (label psc-build), when it is online
#   3. ubuntu-24.04 (GitHub-hosted), when neither self-hosted runner answers - including every
#      failure mode below
#
# A pull_request event is ALWAYS routed to ubuntu-24.04, decided before the App token is even
# requested - a PR (this org is public) never touches either self-hosted box, full stop.
#
# Needs the autobleem-admin GitHub App (org autobleem2) with "Self-hosted runners: read" so it can
# call GET /orgs/autobleem2/actions/runners; AB_ADMIN_APP_ID (org var) + AB_ADMIN_APP_KEY (org
# secret), the same pair promote.yml uses. A caller passes the secret with `secrets: inherit` (or
# explicitly, see below) - vars are visible to a reusable workflow automatically and need nothing
# passed. Any failure minting the token, or a non-200 from the API (most likely: the App has not
# been granted that org permission yet), falls back to ubuntu-24.04 with a `::notice::` explaining
# why, rather than failing the caller's job.
#
# The output is named runs_on, not runs-on: a hyphen in a dotted expression (`outputs.runs-on`)
# parses as subtraction ("outputs.runs" MINUS "on") and GitHub Actions rejects it at workflow-parse
# time ("Unrecognized named-value: 'needs'") - bracket notation would dodge it too, but callers
# would have to remember to write `needs.route.outputs['runs-on']` forever; a clean identifier is
# one less way to get this wrong.
#
# Caller usage:
#   jobs:
#     route:
#       uses: autobleem2/autobleem-build/.github/workflows/route.yml@develop
#       secrets: inherit
#     build:
#       needs: route
#       runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
name: route

on:
  workflow_call:
    secrets:
      AB_ADMIN_APP_KEY:
        required: true
        description: the autobleem-admin GitHub App's private key (org secret AB_ADMIN_APP_KEY)
    outputs:
      runs_on:
        description: >
          JSON for the caller's runs-on - either an array (["self-hosted","ab-main"] /
          ["self-hosted","psc-build"]) or the bare string "ubuntu-24.04". Consume with
          `runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}`.
        value: ${{ jobs.route.outputs.runs_on }}
      runner:
        description: which runner was picked and why, for the caller's own logs
        value: ${{ jobs.route.outputs.runner }}

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      runs_on: ${{ steps.decide.outputs.runs_on }}
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      # Skipped outright for a pull_request - see the header. No token is minted, no API is called.
      - id: app
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AB_ADMIN_APP_ID }}
          private-key: ${{ secrets.AB_ADMIN_APP_KEY }}
          owner: autobleem2

      - name: Decide runs_on
        id: decide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # 1. pull_request: decided before anything else touches the network or a token.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "runner=hosted (pull_request - routed before any API call)" >> "$GITHUB_OUTPUT"
            echo "::notice::pull_request event: routed to ubuntu-24.04 unconditionally, no self-hosted runner is ever offered a PR job"
            exit 0
          fi

          # 2. no token (App not installed / missing the org permission / bad app-id or key) -> hosted.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "runner=hosted (no App token)" >> "$GITHUB_OUTPUT"
            echo "::notice::could not mint an autobleem-admin App token (check AB_ADMIN_APP_ID/AB_ADMIN_APP_KEY reach this repo, and that the App has 'Self-hosted runners: read') - falling back to ubuntu-24.04"
            exit 0
          fi

          # 3. ask the org which runners exist and whether they are online.
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/autobleem2/actions/runners")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')

          if [ "$code" != "200" ]; then
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "runner=hosted (API returned $code)" >> "$GITHUB_OUTPUT"
            echo "::notice::GET /orgs/autobleem2/actions/runners returned $code (most likely: the autobleem-admin App is missing the 'Self-hosted runners: read' org permission) - falling back to ubuntu-24.04"
            exit 0
          fi

          laptop_online=$(echo "$body" | jq -r '[.runners[]? | select(.status=="online") | select(.labels[]?.name=="ab-main")] | length')
          psc_online=$(echo "$body" | jq -r '[.runners[]? | select(.status=="online") | select(.labels[]?.name=="psc-build")] | length')

          if [ "${laptop_online:-0}" -gt 0 ]; then
            echo 'runs_on=["self-hosted","ab-main"]' >> "$GITHUB_OUTPUT"
            echo "runner=ab-main (laptop, online)" >> "$GITHUB_OUTPUT"
          elif [ "${psc_online:-0}" -gt 0 ]; then
            echo 'runs_on=["self-hosted","psc-build"]' >> "$GITHUB_OUTPUT"
            echo "runner=psc-build (build server, online)" >> "$GITHUB_OUTPUT"
          else
            echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo "runner=hosted (neither ab-main nor psc-build is online)" >> "$GITHUB_OUTPUT"
            echo "::notice::no self-hosted runner is online (ab-main and psc-build both offline or not yet registered) - falling back to ubuntu-24.04"
          fi
